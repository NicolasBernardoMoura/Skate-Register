{% extends 'cadastro/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-dark text-white">

                <h2>{{ skatista.nome }}</h2>

                </div>

                <div class="card-body text-center">

                {% if skatista.foto %}

                    <img src="{{ skatista.foto.url }}"
                        class="img-fluid rounded mb-4"
                        style="max-height:300px;">

                    {% else %}

                    <p>Sem foto.</p>

                {% endif %}

                <hr>

                    <p><strong>Idade:</strong> {{ skatista.idade }}</p>

                    <p><strong>Cidade:</strong> {{ skatista.cidade }}</p>

                    <p><strong>Modalidade:</strong> {{ skatista.modalidade }}</p>

                    <p><strong>Nível:</strong> {{ skatista.nivel }}</p>

                <a href="{% url 'editar_skatista' skatista.id %}"

                    class="btn btn-warning">

                    ✏️ Editar

                </a>

                <a href="{% url 'lista_skatistas' %}"

                    class="btn btn-secondary">

                    ⬅ Voltar

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
